name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Housie game rules
        run: swift run HousieCoreTests
      - name: Verify simplified caller experience
        run: HousieTests/verify_caller_experience.sh

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project Housie.xcodeproj
          -scheme Housie
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  ui-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run iPad caller interaction tests
        shell: bash
        run: |
          set -euo pipefail
          ipad_id="$(xcrun simctl list devices available | sed -nE '/iPad Pro 13-inch/ s/.*\(([0-9A-F-]{36})\).*/\1/p' | head -1)"
          test -n "$ipad_id"
          xcodebuild \
            -project Housie.xcodeproj \
            -scheme Housie \
            -destination "platform=iOS Simulator,id=$ipad_id" \
            -derivedDataPath build/DerivedData \
            -only-testing:HousieUITests \
            test
