name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Housie game rules
        run: swift run HousieCoreTests
      - name: Verify simplified caller experience
        run: HousieTests/verify_caller_experience.sh

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project Housie.xcodeproj
          -scheme Housie
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
